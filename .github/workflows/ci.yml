name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Load test data
      run: |
        PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -f tests/sample_data.sql
    
    - name: Run analyzer (without AI)
      run: |
        pg-perf-analyzer analyze \
          --host localhost \
          --database testdb \
          --user testuser \
          --password testpass \
          --skip-ai \
          --output test_report.md
    
    - name: Verify report generated
      run: |
        if [ ! -f test_report.md ]; then
          echo "Report not generated"
          exit 1
        fi
        echo "Report generated successfully"
    
    - name: Check for naming standards section
      run: |
        if grep -q "Naming Standards Analysis" test_report.md; then
          echo "Naming standards section found"
        else
          echo "Naming standards section missing"
          exit 1
        fi
    
    - name: Upload report artifact
      uses: actions/upload-artifact@v3
      with:
        name: test-report-python-${{ matrix.python-version }}
        path: test_report.md

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check code formatting with black
      run: |
        black --check src/
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
