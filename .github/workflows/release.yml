name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        pip install -r requirements.txt
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Create Release Archive
      run: |
        tar --exclude='*.pyc' --exclude='__pycache__' --exclude='.git' \
            --exclude='*.egg-info' --exclude='build' --exclude='dist' \
            -czf pg-perf-analyzer-${{ github.ref_name }}.tar.gz .
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*
          pg-perf-analyzer-${{ github.ref_name }}.tar.gz
        body: |
          ## PostgreSQL Performance Analyzer ${{ github.ref_name }}
          
          ### Installation
          ```bash
          pip install pg-perf-analyzer
          ```
          
          Or download the source archive and install manually:
          ```bash
          tar -xzf pg-perf-analyzer-${{ github.ref_name }}.tar.gz
          cd pg-perf-analyzer
          pip install -r requirements.txt
          pip install -e .
          ```
          
          ### What's Changed
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
